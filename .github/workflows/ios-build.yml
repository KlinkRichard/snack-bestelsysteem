name: Build iOS App

on:
  push:
    paths:
      - 'AZERTYSnacks/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:  # Handmatig starten vanuit GitHub

jobs:
  build:
    name: Build AZERTY Snacks iOS
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: |
          # List available Xcode versions and pick the latest
          ls /Applications/ | grep Xcode
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Using: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Generate app icon
        working-directory: AZERTYSnacks
        run: |
          swift generate-icon.swift AZERTYSnacks/Assets.xcassets/AppIcon.appiconset/appicon-1024.png
          ls -la AZERTYSnacks/Assets.xcassets/AppIcon.appiconset/

      - name: Build for device (unsigned)
        working-directory: AZERTYSnacks
        run: |
          xcodebuild build \
            -project AZERTYSnacks.xcodeproj \
            -scheme AZERTYSnacks \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath $RUNNER_TEMP/DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Create IPA from .app
        run: |
          # Find the built .app
          APP_PATH=$(find $RUNNER_TEMP/DerivedData -name "AZERTYSnacks.app" -type d | head -1)
          echo "Found app at: $APP_PATH"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Could not find AZERTYSnacks.app"
            find $RUNNER_TEMP/DerivedData -name "*.app" -type d
            exit 1
          fi

          # Create IPA structure: Payload/AZERTYSnacks.app
          mkdir -p $RUNNER_TEMP/ipa/Payload
          cp -R "$APP_PATH" $RUNNER_TEMP/ipa/Payload/

          # Zip it as .ipa
          cd $RUNNER_TEMP/ipa
          zip -r $RUNNER_TEMP/AZERTYSnacks.ipa Payload

          echo "IPA created:"
          ls -lh $RUNNER_TEMP/AZERTYSnacks.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AZERTYSnacks-ipa
          path: ${{ runner.temp }}/AZERTYSnacks.ipa
          retention-days: 90

  # Optioneel: build voor TestFlight (vereist signing secrets)
  release:
    name: Build & Sign for TestFlight
    runs-on: macos-14
    needs: build
    if: github.ref == 'refs/heads/main' && vars.APPLE_SIGNING_ENABLED == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"

      - name: Install certificate & provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Build & Archive
        working-directory: AZERTYSnacks
        env:
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project AZERTYSnacks.xcodeproj \
            -scheme AZERTYSnacks \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/AZERTYSnacks.xcarchive \
            -configuration Release \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM"

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/AZERTYSnacks.xcarchive \
            -exportOptionsPlist AZERTYSnacks/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export

      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: AZERTYSnacks-signed-ipa
          path: ${{ runner.temp }}/export/AZERTYSnacks.ipa
          retention-days: 90
