<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AZERTY Snacks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Open Sans', system-ui, sans-serif;
      background: #F0F5FB;
      color: #191919;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      padding: 40px 24px;
      max-width: 480px;
      width: 100%;
    }
    .logo { font-size: 3rem; margin-bottom: 12px; }
    h1 { font-size: 1.6rem; font-weight: 700; color: #1D1D5F; margin-bottom: 6px; }
    p { color: #737373; margin-bottom: 32px; font-size: .9rem; }
    .links { display: flex; flex-direction: column; gap: 14px; }
    .btn {
      display: block;
      padding: 16px 24px;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: 700;
      font-family: inherit;
      text-decoration: none;
      transition: transform .15s, box-shadow .15s;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.15); }
    .btn-order { background: #CF4A0C; color: #fff; }
    .btn-order:hover { background: #AC2700; }
    .btn-admin { background: #1D1D5F; color: #fff; }
    .btn-admin:hover { background: #151545; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">🍟</div>
    <h1>AZERTY Snacks</h1>
    <p>Bestel je snacks of beheer het systeem</p>
    <div class="links">
      <a href="/snack-order.html" class="btn btn-order">🛒 Snacks bestellen</a>
      <a href="/snack-admin.html" class="btn btn-admin">⚙️ Beheer</a>
    </div>
  </div>
</body>
</html>
